version: 2
updates:
  # Python dependencies in backend/pyproject.toml / backend/uv.lock
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Frontend packages in frontend/package.json / package-lock.json
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # @types/node must match the Node version we run (24, see frontend/.nvmrc).
      # Minor and patch updates still come through; remove this when moving Node up.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Action versions used in .github/workflows/
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
