name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          working-directory: backend

      # Pinned ruff version, so a new ruff release can't break CI without a PR.
      - name: Ruff lint
        run: uvx ruff@0.17.1 check --output-format=github .

      - name: Ruff format check
        run: uvx ruff@0.17.1 format --check .
