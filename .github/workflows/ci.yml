name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: this workflow only checks out code and runs tests.
permissions:
  contents: read

# A newer push to the same branch cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Installs uv and the Python version from .python-version (3.12).
      # setup-uv has no floating "v10" tag, so the exact release is pinned.
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          enable-cache: true

      # --locked fails if uv.lock is out of date with pyproject.toml,
      # so CI tests exactly the versions committed in uv.lock.
      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -v
