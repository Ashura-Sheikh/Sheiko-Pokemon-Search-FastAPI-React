name: Security audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Every Monday 07:00 UTC: catches new vulnerabilities in unchanged code.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.1
        with:
          working-directory: backend

      # Audits exactly the versions in uv.lock (with hashes), not whatever is newest.
      - name: Export locked dependencies
        run: uv export --format requirements-txt --no-emit-project -q -o requirements-audit.txt

      - name: pip-audit
        run: uvx pip-audit@2.10.1 -r requirements-audit.txt --disable-pip --progress-spinner off

  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc

      # Checks package-lock.json against the npm advisory database.
      # Fails on high or critical issues; lower ones are reported but don't block.
      - name: npm audit
        run: npm audit --audit-level=high
