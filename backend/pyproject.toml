[project]
name = "pokemon-app-backend"
version = "0.1.0"
description = "FastAPI backend for the Pokémon search and comments app"
authors = [
    { name = "Sheikh M Sahil", email = "55999445+Ashura-Sheikh@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.159.1",
    "python-dotenv>=1.2.4",
    "sqlmodel>=0.0.48",
    "uvicorn>=0.54.0",
]

[tool.uv]
# Plain app, not an installable package: uv won't try to build this project.
# Adding libraries still works as normal: uv add <name>
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
]
